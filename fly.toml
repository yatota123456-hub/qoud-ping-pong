# fly.toml app configuration file generated for qoud-ping-pong-tqk-6q on 2026-09-13T13:37:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'qoud-ping-pong-tqk-6q'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '2567'

# استبدلي [http_service] تماماً بـ [[services]]
[[services]]
  http_checks = []
  internal_port = 2567
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[experimental]
  entrypoint = ["pnpm", "start"]

