app = "qoud-ping-pong-tqk-6q"
primary_region = "fra"
# للسعودية: fra أقرب، نضيف sin و ams كبدائل
# لتشغيل multi-region: fly regions add sin ams

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
